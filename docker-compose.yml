name: aiw

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiw
      POSTGRES_USER: aiw
      POSTGRES_PASSWORD: ${AIW_DB_PASSWORD:?set AIW_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiw -d aiw"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      AIW_DB_URL: jdbc:postgresql://postgres:5432/aiw
      AIW_DB_USER: aiw
      AIW_DB_PASSWORD: ${AIW_DB_PASSWORD:?set AIW_DB_PASSWORD in .env}
      AIW_REDIS_HOST: redis
      AIW_REDIS_PORT: 6379
      AIW_PORT: 8090
      AIW_MASTER_KEY: ${AIW_MASTER_KEY:?set AIW_MASTER_KEY in .env}
      AIW_ALLOWED_ORIGINS: ${AIW_ALLOWED_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
      AIW_DATA_DIR: /root/.aiw
      AIW_SANDBOX_ENABLED: ${AIW_SANDBOX_ENABLED:-true}
      # Sandboxes are started by the host's Docker daemon: they mount worktrees from this volume, not from a path.
      AIW_SANDBOX_DATA_VOLUME: aiw_aiwdata
      # Existing projects to import (docs/17): put a folder in ./imports, then choose it when creating a project.
      AIW_IMPORT_DIR: /imports
      # Increment 6 (docs/18): Prometheus reads /actuator/prometheus with this token; traces go to Jaeger when exported.
      AIW_METRICS_TOKEN: ${AIW_METRICS_TOKEN:-}
      AIW_TRACING_EXPORT: ${AIW_TRACING_EXPORT:-false}
      AIW_OTLP_ENDPOINT: ${AIW_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8090:8090"
    volumes:
      - aiwdata:/root/.aiw
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AIW_IMPORT_HOST_DIR:-./imports}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5180:5180"
    depends_on:
      backend:
        condition: service_started

  # Observability (docs/18): docker compose --env-file .env --profile observability up -d
  # Set AIW_TRACING_EXPORT=true in .env to send traces to Jaeger.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    environment:
      AIW_METRICS_TOKEN: ${AIW_METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c", "printf '%s' \"$$AIW_METRICS_TOKEN\" > /prometheus/token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${AIW_GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  promdata:
  grafanadata:
  pgdata:
  redisdata:
  aiwdata:
    name: aiw_aiwdata # fixed name: sandboxes mount it (AIW_SANDBOX_DATA_VOLUME)
