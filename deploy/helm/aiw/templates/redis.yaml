{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
