apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.backend.dataStorage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: backend, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: backend
          image: {{ .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{ secretRef: { name: {{ include "aiw.secretName" . }} } }]
          env:
            - { name: AIW_DB_URL, value: "jdbc:postgresql://postgres:5432/aiw" }
            - { name: AIW_DB_USER, value: aiw }
            - { name: AIW_REDIS_HOST, value: redis }
            - { name: AIW_REDIS_PORT, value: "6379" }
            - { name: AIW_PORT, value: "8090" }
            - { name: AIW_DATA_DIR, value: /data }
            - { name: AIW_ALLOWED_ORIGINS, value: {{ .Values.backend.allowedOrigins | quote }} }
            - { name: AIW_SANDBOX_ENABLED, value: {{ .Values.sandbox.enabled | quote }} }
            - { name: DOCKER_HOST, value: {{ .Values.sandbox.dockerHost | quote }} }
            - { name: AIW_TRACING_EXPORT, value: {{ .Values.backend.tracing.export | quote }} }
            {{- with .Values.backend.tracing.otlpEndpoint }}
            - { name: AIW_OTLP_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.sandbox.dockerTlsSecret }}
            - { name: DOCKER_TLS_VERIFY, value: "1" }
            - { name: DOCKER_CERT_PATH, value: /docker-certs }
            {{- end }}
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.sandbox.dockerTlsSecret }}
            - { name: docker-certs, mountPath: /docker-certs, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-data }
        {{- if .Values.sandbox.dockerTlsSecret }}
        - name: docker-certs
          secret: { secretName: {{ .Values.sandbox.dockerTlsSecret }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: backend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8090, targetPort: http }]
