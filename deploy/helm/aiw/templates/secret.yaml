{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiw.secretName" . }}
  labels: {{- include "aiw.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIW_DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  AIW_MASTER_KEY: {{ required "secrets.masterKey is required (openssl rand -base64 32)" .Values.secrets.masterKey | quote }}
  AIW_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
{{- end }}
