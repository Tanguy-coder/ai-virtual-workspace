apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 5180 }]
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "aiw.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: frontend, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
