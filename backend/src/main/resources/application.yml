spring:
  application:
    name: aiw
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AIW_DB_URL:jdbc:postgresql://localhost:55432/aiw}
    username: ${AIW_DB_USER:aiw}
    password: ${AIW_DB_PASSWORD:}
  data:
    redis:
      host: ${AIW_REDIS_HOST:localhost}
      port: ${AIW_REDIS_PORT:56379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${AIW_PORT:8090}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        name: AIW_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health

aiw:
  security:
    master-key: ${AIW_MASTER_KEY}
  web:
    allowed-origins: ${AIW_ALLOWED_ORIGINS:http://localhost:5180}
  # Increment 4: repositories, worktrees and sandboxes (docs/10).
  data-dir: ${AIW_DATA_DIR:${user.home}/.aiw}
  sandbox:
    enabled: ${AIW_SANDBOX_ENABLED:true}
    cpus: "1"
    memory: 1g
    command-timeout-seconds: 300
    # When the platform itself runs in Docker with its data in a named volume, sandboxes mount their worktree from
    # that volume: a path inside the platform's container means nothing to the Docker daemon on the host.
    data-volume: ${AIW_SANDBOX_DATA_VOLUME:}
  execution:
    auto-start: ${AIW_AUTO_START:true}
    max-steps-per-segment: 40
    token-budget: 200000
